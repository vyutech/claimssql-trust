# Theme for the ClaimsSQL-Trust demo app.
# Adapted from Streamlit's "shadcn-dual" template: slate surfaces with a calm teal
# accent. Both [theme.light] and [theme.dark] are set, so viewers keep the
# light/dark switch in the app's settings menu.

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.85rem"
baseFontSize = 15
headingFontWeights = [650, 600, 600, 600, 600, 600]
linkUnderline = false

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FA"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#0F766E"
borderColor = "#E2E8F0"
codeTextColor = "#0F172A"
grayColor = "#64748B"
blueColor = "#2563EB"
greenColor = "#15803D"
redColor = "#B91C1C"
yellowColor = "#A16207"
orangeColor = "#C2410C"
violetColor = "#6D28D9"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F6F8FA"

[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C2E"
codeBackgroundColor = "#1B2638"
textColor = "#E2E8F0"
linkColor = "#5EEAD4"
borderColor = "#24324A"
codeTextColor = "#E2E8F0"
grayColor = "#94A3B8"
blueColor = "#60A5FA"
greenColor = "#4ADE80"
redColor = "#F87171"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
violetColor = "#A78BFA"
dataframeBorderColor = "#24324A"
dataframeHeaderBackgroundColor = "#131C2E"
dataframeHeaderTextColor = "#E2E8F0"

[theme.light.sidebar]
backgroundColor = "#F6F8FA"
secondaryBackgroundColor = "#EEF2F6"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#0F766E"
linkColor = "#0F766E"

[theme.dark.sidebar]
backgroundColor = "#080E1A"
secondaryBackgroundColor = "#131C2E"
textColor = "#E2E8F0"
borderColor = "#24324A"
primaryColor = "#2DD4BF"
linkColor = "#5EEAD4"
