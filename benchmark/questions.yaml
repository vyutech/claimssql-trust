- id: H-022
  group: hard
  question: How many members had three or more of the 11 chronic conditions in 2010?
  sql: |-
    SELECT COUNT(*)
    FROM beneficiary
    WHERE year = 2010
      AND (
          (SP_ALZHDMTA = 1)::INTEGER + (SP_CHF = 1)::INTEGER + (SP_CHRNKIDN = 1)::INTEGER +
          (SP_CNCR = 1)::INTEGER + (SP_COPD = 1)::INTEGER + (SP_DEPRESSN = 1)::INTEGER +
          (SP_DIABETES = 1)::INTEGER + (SP_ISCHMCHT = 1)::INTEGER + (SP_OSTEOPRS = 1)::INTEGER +
          (SP_RA_OA = 1)::INTEGER + (SP_STRKETIA = 1)::INTEGER
      ) >= 3;
  tags: [coded_flag, multi_year_beneficiary]
  notes: Flags are 1 = yes, 2 = no, so summing raw flags is wrong.

- id: H-023
  group: hard
  question: In 2009, what was the average number of chronic conditions per member in each age band (under 65, 65-74, 75-84, 85+)?
  sql: |-
    WITH m AS (
      SELECT 2009 - BENE_BIRTH_DT // 10000 AS age,
             (SP_ALZHDMTA = 1)::INTEGER + (SP_CHF = 1)::INTEGER + (SP_CHRNKIDN = 1)::INTEGER +
             (SP_CNCR = 1)::INTEGER + (SP_COPD = 1)::INTEGER + (SP_DEPRESSN = 1)::INTEGER +
             (SP_DIABETES = 1)::INTEGER + (SP_ISCHMCHT = 1)::INTEGER + (SP_OSTEOPRS = 1)::INTEGER +
             (SP_RA_OA = 1)::INTEGER + (SP_STRKETIA = 1)::INTEGER AS n_conditions
      FROM beneficiary
      WHERE year = 2009
    )
    SELECT CASE WHEN age < 65 THEN '1: <65'
                WHEN age < 75 THEN '2: 65-74'
                WHEN age < 85 THEN '3: 75-84'
                ELSE '4: 85+' END AS age_band,
           AVG(n_conditions) AS avg_conditions
    FROM m
    GROUP BY age_band
    ORDER BY age_band;
  tags: [coded_flag, raw_integer_dates, multi_year_beneficiary]
  notes: Age reached in 2009.

- id: H-024
  group: hard
  question: Which pair of chronic conditions occurred together most often in 2008?
  sql: |-
    WITH f AS (
      SELECT DESYNPUF_ID, 'SP_ALZHDMTA' AS cond FROM beneficiary WHERE year = 2008 AND SP_ALZHDMTA = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_CHF' AS cond FROM beneficiary WHERE year = 2008 AND SP_CHF = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_CHRNKIDN' AS cond FROM beneficiary WHERE year = 2008 AND SP_CHRNKIDN = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_CNCR' AS cond FROM beneficiary WHERE year = 2008 AND SP_CNCR = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_COPD' AS cond FROM beneficiary WHERE year = 2008 AND SP_COPD = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_DEPRESSN' AS cond FROM beneficiary WHERE year = 2008 AND SP_DEPRESSN = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_DIABETES' AS cond FROM beneficiary WHERE year = 2008 AND SP_DIABETES = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_ISCHMCHT' AS cond FROM beneficiary WHERE year = 2008 AND SP_ISCHMCHT = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_OSTEOPRS' AS cond FROM beneficiary WHERE year = 2008 AND SP_OSTEOPRS = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_RA_OA' AS cond FROM beneficiary WHERE year = 2008 AND SP_RA_OA = 1
      UNION ALL
      SELECT DESYNPUF_ID, 'SP_STRKETIA' AS cond FROM beneficiary WHERE year = 2008 AND SP_STRKETIA = 1
    )
    SELECT a.cond AS condition_1, b.cond AS condition_2, COUNT(*) AS members
    FROM f a
    JOIN f b
      ON a.DESYNPUF_ID = b.DESYNPUF_ID
     AND a.cond < b.cond
    GROUP BY a.cond, b.cond
    ORDER BY members DESC, condition_1, condition_2
    LIMIT 1;
  tags: [coded_flag, multi_year_beneficiary]
  notes: Unpivot the 11 flags, then self-join pairs.

- id: H-025
  group: hard
  question: Which year saw the largest increase in the number of members with depression compared with the year before?
  sql: |-
    WITH t AS (
      SELECT year, COUNT(*) AS members
      FROM beneficiary
      WHERE SP_DEPRESSN = 1
      GROUP BY year
    )
    SELECT year, members - LAG(members) OVER (ORDER BY year) AS change
    FROM t
    QUALIFY change IS NOT NULL
    ORDER BY change DESC, year
    LIMIT 1;
  tags: [coded_flag, multi_year_beneficiary]
  notes: Change may be negative if counts fall. Ties broken by code so the answer is deterministic.

- id: H-026
  group: hard
  question: What percentage of members in the 2008 data had died by the end of 2010?
  sql: |-
    WITH dead AS (
      SELECT DISTINCT DESYNPUF_ID
      FROM beneficiary
      WHERE BENE_DEATH_DT BETWEEN 20080101 AND 20101231
    )
    SELECT 100.0 * COUNT(d.DESYNPUF_ID) / COUNT(*) AS pct_died
    FROM beneficiary b
    LEFT JOIN dead d
      ON d.DESYNPUF_ID = b.DESYNPUF_ID
    WHERE b.year = 2008;
  tags: [death_attrition, multi_year_beneficiary, raw_integer_dates]
  notes: Base is the 2008 cohort.

- id: H-027
  group: hard
  question: What was the average age at death for members who died between 2008 and 2010?
  sql: |-
    SELECT AVG(death_year - birth_year)
    FROM (
      SELECT DISTINCT DESYNPUF_ID,
             BENE_DEATH_DT // 10000 AS death_year,
             BENE_BIRTH_DT // 10000 AS birth_year
      FROM beneficiary
      WHERE BENE_DEATH_DT IS NOT NULL
    );
  tags: [raw_integer_dates, death_attrition, multi_year_beneficiary]
  notes: One row per member before averaging.

- id: H-028
  group: hard
  question: Which 5 states had the highest average total Medicare reimbursement per member in 2009, adding inpatient, outpatient and carrier?
  sql: |-
    SELECT SP_STATE_CODE,
           AVG(MEDREIMB_IP + MEDREIMB_OP + MEDREIMB_CAR) AS avg_total
    FROM beneficiary
    WHERE year = 2009
    GROUP BY SP_STATE_CODE
    ORDER BY avg_total DESC, SP_STATE_CODE
    LIMIT 5;
  tags: [ssa_state_code, payment_type, multi_year_beneficiary]
  notes: Three summary columns added. Ties broken by code so the answer is deterministic.

- id: H-029
  group: hard
  question: What was the 2009 Medicare inpatient cost per member per month of Part A coverage?
  sql: |-
    WITH c AS (
      SELECT CLM_ID, DESYNPUF_ID,
             MIN(CLM_FROM_DT) AS start_dt,
             MIN(CLM_DRG_CD) AS drg,
             SUM(CLM_PMT_AMT) AS paid
      FROM inpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    )
    SELECT
      (SELECT SUM(paid) FROM c WHERE start_dt BETWEEN 20090101 AND 20091231)
      /
      (SELECT SUM(BENE_HI_CVRAGE_TOT_MONS) FROM beneficiary WHERE year = 2009)
      AS pmpm;
  tags: [partial_enrollment, cross_table, payment_type, claim_segments, null_handling]
  notes: Denominator is member-months; numerator keeps segment-2 payments.

- id: H-030
  group: hard
  question: Among states with at least 1,000 members in 2010, what share had 90% or more of members with full-year Part A coverage?
  sql: |-
    WITH s AS (
      SELECT SP_STATE_CODE,
             AVG(CASE WHEN BENE_HI_CVRAGE_TOT_MONS = 12 THEN 1.0 ELSE 0.0 END) AS full_share
      FROM beneficiary
      WHERE year = 2010
      GROUP BY SP_STATE_CODE
      HAVING COUNT(*) >= 1000
    )
    SELECT AVG(CASE WHEN full_share >= 0.9 THEN 1.0 ELSE 0.0 END)
    FROM s;
  tags: [partial_enrollment, ssa_state_code, multi_year_beneficiary]
  notes: Two-level aggregation.

- id: H-031
  group: hard
  question: What percentage of 2009 members had 0, 1, 2, and 3 or more hospital stays starting that year?
  sql: |-
    WITH c AS (
      SELECT b.DESYNPUF_ID, COUNT(DISTINCT i.CLM_ID) AS stays
      FROM beneficiary b
      LEFT JOIN inpatient_claims i
        ON i.DESYNPUF_ID = b.DESYNPUF_ID
       AND i.CLM_FROM_DT BETWEEN 20090101 AND 20091231
      WHERE b.year = 2009
      GROUP BY b.DESYNPUF_ID
    )
    SELECT CASE WHEN stays >= 3 THEN '3+' ELSE CAST(stays AS VARCHAR) END AS bucket,
           100.0 * COUNT(*) / SUM(COUNT(*)) OVER () AS pct_members
    FROM c
    GROUP BY bucket
    ORDER BY bucket;
  tags: [null_handling, cross_table, multi_year_beneficiary, claim_segments]
  notes: LEFT JOIN keeps members with zero stays.

- id: H-032
  group: hard
  question: In 2009, what were average hospital days per member for members with and without ESRD, counting members with no stays as zero?
  sql: |-
    WITH d AS (
      SELECT b.DESYNPUF_ID, b.BENE_ESRD_IND,
             COALESCE(SUM(i.CLM_UTLZTN_DAY_CNT), 0) AS days
      FROM beneficiary b
      LEFT JOIN inpatient_claims i
        ON i.DESYNPUF_ID = b.DESYNPUF_ID
       AND i.CLM_FROM_DT BETWEEN 20090101 AND 20091231
      WHERE b.year = 2009
      GROUP BY b.DESYNPUF_ID, b.BENE_ESRD_IND
    )
    SELECT BENE_ESRD_IND, AVG(days) AS avg_days
    FROM d
    GROUP BY BENE_ESRD_IND
    ORDER BY BENE_ESRD_IND;
  tags: [cross_table, null_handling, code_as_text]
  notes: Zero-stay members must count.

- id: H-033
  group: hard
  question: In 2010, what was the average total Medicare claim payment per member for members with and without diabetes, across all claim types?
  sql: |-
    WITH ip AS (
      SELECT CLM_ID, DESYNPUF_ID, MIN(CLM_FROM_DT) AS start_dt, SUM(CLM_PMT_AMT) AS paid
      FROM inpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    ),
    op AS (
      SELECT CLM_ID, DESYNPUF_ID, MIN(CLM_FROM_DT) AS start_dt, SUM(CLM_PMT_AMT) AS paid
      FROM outpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    ),
    claims AS (
      SELECT DESYNPUF_ID, paid FROM ip
      WHERE start_dt BETWEEN 20100101 AND 20101231
      UNION ALL
      SELECT DESYNPUF_ID, paid FROM op
      WHERE start_dt BETWEEN 20100101 AND 20101231
      UNION ALL
      SELECT DESYNPUF_ID,
             COALESCE(LINE_NCH_PMT_AMT_1, 0) + COALESCE(LINE_NCH_PMT_AMT_2, 0) + COALESCE(LINE_NCH_PMT_AMT_3, 0) +
               COALESCE(LINE_NCH_PMT_AMT_4, 0) + COALESCE(LINE_NCH_PMT_AMT_5, 0) + COALESCE(LINE_NCH_PMT_AMT_6, 0) +
               COALESCE(LINE_NCH_PMT_AMT_7, 0) + COALESCE(LINE_NCH_PMT_AMT_8, 0) + COALESCE(LINE_NCH_PMT_AMT_9, 0) +
               COALESCE(LINE_NCH_PMT_AMT_10, 0) + COALESCE(LINE_NCH_PMT_AMT_11, 0) + COALESCE(LINE_NCH_PMT_AMT_12, 0) +
               COALESCE(LINE_NCH_PMT_AMT_13, 0)
      FROM carrier_claims
      WHERE CLM_FROM_DT BETWEEN 20100101 AND 20101231
    ),
    m AS (
      SELECT DESYNPUF_ID, SUM(paid) AS total
      FROM claims
      GROUP BY DESYNPUF_ID
    )
    SELECT b.SP_DIABETES, AVG(COALESCE(m.total, 0)) AS avg_paid
    FROM beneficiary b
    LEFT JOIN m
      ON m.DESYNPUF_ID = b.DESYNPUF_ID
    WHERE b.year = 2010
    GROUP BY b.SP_DIABETES
    ORDER BY b.SP_DIABETES;
  tags: [cross_table, wide_line_items, coded_flag, payment_type, claim_segments, null_handling]
  notes: Members with no claims count as zero; segment-2 payments kept via per-claim totals.

- id: H-034
  group: hard
  question: How many members had a hospital stay starting in 2010 but no claims of any type starting in 2009?
  sql: |-
    SELECT COUNT(*)
    FROM (
      SELECT DISTINCT DESYNPUF_ID
      FROM inpatient_claims
      WHERE CLM_FROM_DT BETWEEN 20100101 AND 20101231
    ) x
    WHERE NOT EXISTS (SELECT 1 FROM inpatient_claims i
                      WHERE i.DESYNPUF_ID = x.DESYNPUF_ID
                        AND i.CLM_FROM_DT BETWEEN 20090101 AND 20091231)
      AND NOT EXISTS (SELECT 1 FROM outpatient_claims o
                      WHERE o.DESYNPUF_ID = x.DESYNPUF_ID
                        AND o.CLM_FROM_DT BETWEEN 20090101 AND 20091231)
      AND NOT EXISTS (SELECT 1 FROM carrier_claims c
                      WHERE c.DESYNPUF_ID = x.DESYNPUF_ID
                        AND c.CLM_FROM_DT BETWEEN 20090101 AND 20091231);
  tags: [cross_table, date_basis]
  notes: Checks all three claim tables.

- id: H-035
  group: hard
  question: How many hospital stays discharged in 2009 were followed by an outpatient visit within 7 days of discharge?
  sql: |-
    WITH stays AS (
      SELECT CLM_ID, DESYNPUF_ID,
             MIN(PRVDR_NUM) AS prov,
             try_strptime(CAST(MIN(CLM_ADMSN_DT) AS VARCHAR), '%Y%m%d')::DATE AS admit,
             try_strptime(CAST(MAX(NCH_BENE_DSCHRG_DT) AS VARCHAR), '%Y%m%d')::DATE AS disch
      FROM inpatient_claims
      WHERE CLM_ADMSN_DT IS NOT NULL AND NCH_BENE_DSCHRG_DT IS NOT NULL
      GROUP BY CLM_ID, DESYNPUF_ID
    )
    SELECT COUNT(*)
    FROM stays s
    WHERE year(s.disch) = 2009
      AND EXISTS (
        SELECT 1
        FROM outpatient_claims o
        WHERE o.DESYNPUF_ID = s.DESYNPUF_ID
          AND try_strptime(CAST(o.CLM_FROM_DT AS VARCHAR), '%Y%m%d')::DATE
              BETWEEN s.disch AND s.disch + INTERVAL 7 DAY
      );
  tags: [raw_integer_dates, cross_table, claim_segments]
  notes: Date arithmetic needs real dates, not integers.

- id: H-036
  group: hard
  question: How many 2009 members had summary inpatient reimbursement that differs from their 2009 inpatient claim payments by more than $1,000?
  sql: |-
    WITH c AS (
      SELECT CLM_ID, DESYNPUF_ID,
             MIN(CLM_FROM_DT) AS start_dt,
             MIN(CLM_DRG_CD) AS drg,
             SUM(CLM_PMT_AMT) AS paid
      FROM inpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    ),
    m AS (
      SELECT DESYNPUF_ID, SUM(paid) AS claims_paid
      FROM c
      WHERE start_dt BETWEEN 20090101 AND 20091231
      GROUP BY DESYNPUF_ID
    )
    SELECT COUNT(*)
    FROM beneficiary b
    LEFT JOIN m
      ON m.DESYNPUF_ID = b.DESYNPUF_ID
    WHERE b.year = 2009
      AND ABS(b.MEDREIMB_IP - COALESCE(m.claims_paid, 0)) > 1000;
  tags: [payment_type, multi_year_beneficiary, cross_table, claim_segments, null_handling]
  notes: Reconciliation between summary and claim totals; segment-2 payments included.

- id: H-037
  group: hard
  question: How many hospitals have an average Medicare payment per stay more than twice the overall average?
  sql: |-
    WITH s AS (
      SELECT CLM_ID, MIN(PRVDR_NUM) AS prov, SUM(CLM_PMT_AMT) AS paid
      FROM inpatient_claims
      GROUP BY CLM_ID
    ),
    h AS (
      SELECT prov, AVG(paid) AS avg_paid
      FROM s
      GROUP BY prov
    )
    SELECT COUNT(*)
    FROM h
    WHERE avg_paid > 2 * (SELECT AVG(paid) FROM s);
  tags: [claim_segments, payment_type]
  notes: Per-stay totals first.

- id: H-038
  group: hard
  question: What percentage of inpatient claim records have a utilization day count different from discharge date minus admission date?
  sql: |-
    WITH r AS (
      SELECT CLM_UTLZTN_DAY_CNT AS days,
             date_diff('day',
               try_strptime(CAST(CLM_ADMSN_DT AS VARCHAR), '%Y%m%d')::DATE,
               try_strptime(CAST(NCH_BENE_DSCHRG_DT AS VARCHAR), '%Y%m%d')::DATE) AS span
      FROM inpatient_claims
      WHERE CLM_ADMSN_DT IS NOT NULL
        AND NCH_BENE_DSCHRG_DT IS NOT NULL
        AND CLM_UTLZTN_DAY_CNT IS NOT NULL
    )
    SELECT 100.0 * AVG(CASE WHEN days <> span THEN 1.0 ELSE 0.0 END) AS pct_mismatch
    FROM r;
  tags: [raw_integer_dates, null_handling]
  notes: Date subtraction on YYYYMMDD integers would be wrong.

- id: H-039
  group: hard
  question: For each start year 2008-2010, what percentage of outpatient claims are split into more than one segment?
  sql: |-
    WITH c AS (
      SELECT CLM_ID, MIN(CLM_FROM_DT) // 10000 AS start_year, COUNT(*) AS n_rows
      FROM outpatient_claims
      GROUP BY CLM_ID
    )
    SELECT start_year,
           100.0 * AVG(CASE WHEN n_rows > 1 THEN 1.0 ELSE 0.0 END) AS pct_multi_segment
    FROM c
    WHERE start_year BETWEEN 2008 AND 2010
    GROUP BY start_year
    ORDER BY start_year;
  tags: [claim_segments]
  notes: Rows per CLM_ID.

- id: H-040
  group: hard
  question: Which 5 members saw the most different attending physicians across their hospital stays?
  sql: |-
    SELECT DESYNPUF_ID, COUNT(DISTINCT AT_PHYSN_NPI) AS physicians
    FROM inpatient_claims
    GROUP BY DESYNPUF_ID
    ORDER BY physicians DESC, DESYNPUF_ID
    LIMIT 5;
  tags: [null_handling]
  notes: Ties broken by member ID so the answer is deterministic.

