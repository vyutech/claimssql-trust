- id: M-001
  group: medium
  question: How many members lived in each state in 2008?
  sql: |-
    SELECT SP_STATE_CODE, COUNT(*) AS members
    FROM beneficiary
    WHERE year = 2008
    GROUP BY SP_STATE_CODE
    ORDER BY SP_STATE_CODE;
  tags: [ssa_state_code, multi_year_beneficiary]
  notes: One row per state code; codes are SSA codes, not names.

- id: M-002
  group: medium
  question: How many male and female members were there in each year?
  sql: |-
    SELECT year, BENE_SEX_IDENT_CD, COUNT(*) AS members
    FROM beneficiary
    GROUP BY year, BENE_SEX_IDENT_CD
    ORDER BY year, BENE_SEX_IDENT_CD;
  tags: [code_as_text]
  notes: Sex is a text code.

- id: M-003
  group: medium
  question: How many members had diabetes in each year from 2008 to 2010?
  sql: |-
    SELECT year, COUNT(*) AS members
    FROM beneficiary
    WHERE SP_DIABETES = 1
    GROUP BY year
    ORDER BY year;
  tags: [coded_flag]
  notes: 1 = yes, 2 = no.

- id: M-004
  group: medium
  question: How many members had both diabetes and heart failure in 2009?
  sql: |-
    SELECT COUNT(*)
    FROM beneficiary
    WHERE year = 2009
      AND SP_DIABETES = 1
      AND SP_CHF = 1;
  tags: [coded_flag, multi_year_beneficiary]
  notes: Both flags must equal 1.

- id: M-005
  group: medium
  question: Which 5 states had the most members with COPD in 2010?
  sql: |-
    SELECT SP_STATE_CODE, COUNT(*) AS members
    FROM beneficiary
    WHERE year = 2010
      AND SP_COPD = 1
    GROUP BY SP_STATE_CODE
    ORDER BY members DESC, SP_STATE_CODE
    LIMIT 5;
  tags: [coded_flag, ssa_state_code, multi_year_beneficiary]
  notes: Top 5 by member count. Ties broken by code so the answer is deterministic.

- id: M-006
  group: medium
  question: What was the average Medicare inpatient reimbursement per member for each race in 2008?
  sql: |-
    SELECT BENE_RACE_CD, AVG(MEDREIMB_IP) AS avg_reimb
    FROM beneficiary
    WHERE year = 2008
    GROUP BY BENE_RACE_CD
    ORDER BY BENE_RACE_CD;
  tags: [code_as_text, payment_type, multi_year_beneficiary]
  notes: Race is a text code; MEDREIMB is Medicare's amount.

- id: M-007
  group: medium
  question: How many 2009 members turned 85 or older during 2009?
  sql: |-
    SELECT COUNT(*)
    FROM beneficiary
    WHERE year = 2009
      AND 2009 - BENE_BIRTH_DT // 10000 >= 85;
  tags: [raw_integer_dates, multi_year_beneficiary]
  notes: Birth year = BENE_BIRTH_DT // 10000; age reached in 2009.

- id: M-008
  group: medium
  question: What was the average age reached in 2010 by members with ESRD?
  sql: |-
    SELECT AVG(2010 - BENE_BIRTH_DT // 10000)
    FROM beneficiary
    WHERE year = 2010
      AND BENE_ESRD_IND = 'Y';
  tags: [raw_integer_dates, code_as_text, multi_year_beneficiary]
  notes: ESRD indicator 'Y'.

- id: M-009
  group: medium
  question: How many members had full-year Part A and Part B coverage in 2009?
  sql: |-
    SELECT COUNT(*)
    FROM beneficiary
    WHERE year = 2009
      AND BENE_HI_CVRAGE_TOT_MONS = 12
      AND BENE_SMI_CVRAGE_TOT_MONS = 12;
  tags: [partial_enrollment, multi_year_beneficiary]
  notes: HI = Part A, SMI = Part B.

- id: M-010
  group: medium
  question: How many members appear in the 2008 data but not in the 2010 data?
  sql: |-
    SELECT COUNT(*)
    FROM (
      SELECT DESYNPUF_ID FROM beneficiary WHERE year = 2008
      EXCEPT
      SELECT DESYNPUF_ID FROM beneficiary WHERE year = 2010
    );
  tags: [death_attrition, multi_year_beneficiary]
  notes: Members leave mainly through death.

- id: M-011
  group: medium
  question: How many members lived in a different state in 2009 than in 2008?
  sql: |-
    SELECT COUNT(*)
    FROM beneficiary a
    JOIN beneficiary b
      ON a.DESYNPUF_ID = b.DESYNPUF_ID
    WHERE a.year = 2008
      AND b.year = 2009
      AND a.SP_STATE_CODE <> b.SP_STATE_CODE;
  tags: [multi_year_beneficiary, ssa_state_code]
  notes: Self-join across years.

- id: M-012
  group: medium
  question: How many hospital stays started in each year?
  sql: |-
    SELECT CLM_FROM_DT // 10000 AS start_year, COUNT(DISTINCT CLM_ID) AS stays
    FROM inpatient_claims
    WHERE CLM_FROM_DT IS NOT NULL
    GROUP BY start_year
    ORDER BY start_year;
  tags: [claim_segments, raw_integer_dates, date_basis, null_handling]
  notes: Includes a small 2007 group for stays that began before the data period.

- id: M-013
  group: medium
  question: What was total Medicare inpatient payment for each year that stays started?
  sql: |-
    WITH c AS (
      SELECT CLM_ID, DESYNPUF_ID,
             MIN(CLM_FROM_DT) AS start_dt,
             SUM(CLM_PMT_AMT) AS paid
      FROM inpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    )
    SELECT start_dt // 10000 AS start_year, SUM(paid) AS total_paid
    FROM c
    WHERE start_dt IS NOT NULL
    GROUP BY start_year
    ORDER BY start_year;
  tags: [payment_type, date_basis, raw_integer_dates, claim_segments, null_handling]
  notes: Grouped by claim start year. Segment-2 rows have no dates but carry payments, so amounts are summed per claim before filtering on the claim's start date.

- id: M-014
  group: medium
  question: What is the average Medicare payment per hospital stay?
  sql: |-
    SELECT AVG(total_paid)
    FROM (
      SELECT CLM_ID, SUM(CLM_PMT_AMT) AS total_paid
      FROM inpatient_claims
      GROUP BY CLM_ID
    );
  tags: [claim_segments, payment_type]
  notes: Sum segment rows per claim first, then average.

- id: M-015
  group: medium
  question: What was the average length of a hospital stay for each start year?
  sql: |-
    SELECT start_year, AVG(days) AS avg_days
    FROM (
      SELECT CLM_ID,
             MIN(CLM_FROM_DT) // 10000 AS start_year,
             SUM(CLM_UTLZTN_DAY_CNT) AS days
      FROM inpatient_claims
      GROUP BY CLM_ID
    )
    WHERE start_year IS NOT NULL
    GROUP BY start_year
    ORDER BY start_year;
  tags: [claim_segments, date_basis]
  notes: Assumes segment rows split the days of one stay; owner to verify on a two-segment claim.

- id: M-016
  group: medium
  question: How many hospital stays started in each month of 2009?
  sql: |-
    SELECT (CLM_FROM_DT // 100) % 100 AS month, COUNT(DISTINCT CLM_ID) AS stays
    FROM inpatient_claims
    WHERE CLM_FROM_DT BETWEEN 20090101 AND 20091231
    GROUP BY month
    ORDER BY month;
  tags: [raw_integer_dates, claim_segments]
  notes: Month extracted from a YYYYMMDD integer.

- id: M-017
  group: medium
  question: Which 5 DRG codes had the most hospital stays?
  sql: |-
    SELECT CLM_DRG_CD, COUNT(DISTINCT CLM_ID) AS stays
    FROM inpatient_claims
    WHERE CLM_DRG_CD IS NOT NULL
    GROUP BY CLM_DRG_CD
    ORDER BY stays DESC, CLM_DRG_CD
    LIMIT 5;
  tags: [claim_segments, null_handling]
  notes: Counts distinct claims per DRG. Ties broken by code so the answer is deterministic.

- id: M-018
  group: medium
  question: Which 10 hospitals received the most Medicare inpatient payment?
  sql: |-
    SELECT PRVDR_NUM, SUM(CLM_PMT_AMT) AS total_paid
    FROM inpatient_claims
    GROUP BY PRVDR_NUM
    ORDER BY total_paid DESC, PRVDR_NUM
    LIMIT 10;
  tags: [payment_type]
  notes: Ranked by Medicare payment. Ties broken by code so the answer is deterministic.

- id: M-019
  group: medium
  question: What were the 5 most common admitting diagnoses?
  sql: |-
    SELECT ADMTNG_ICD9_DGNS_CD, COUNT(DISTINCT CLM_ID) AS stays
    FROM inpatient_claims
    WHERE ADMTNG_ICD9_DGNS_CD IS NOT NULL
    GROUP BY ADMTNG_ICD9_DGNS_CD
    ORDER BY stays DESC, ADMTNG_ICD9_DGNS_CD
    LIMIT 5;
  tags: [code_as_text, null_handling, claim_segments]
  notes: ICD-9 codes as text. Ties broken by code so the answer is deterministic.

- id: M-020
  group: medium
  question: Among DRGs with at least 50 stays, which has the longest average stay?
  sql: |-
    SELECT drg, AVG(days) AS avg_days
    FROM (
      SELECT CLM_ID,
             MIN(CLM_DRG_CD) AS drg,
             SUM(CLM_UTLZTN_DAY_CNT) AS days
      FROM inpatient_claims
      GROUP BY CLM_ID
    )
    WHERE drg IS NOT NULL
    GROUP BY drg
    HAVING COUNT(*) >= 50
    ORDER BY avg_days DESC, drg
    LIMIT 1;
  tags: [claim_segments, null_handling]
  notes: Per-claim days first, then HAVING on stay count. Ties broken by code so the answer is deterministic.

- id: M-021
  group: medium
  question: How many hospital stays started before 2008?
  sql: |-
    SELECT COUNT(DISTINCT CLM_ID)
    FROM inpatient_claims
    WHERE CLM_FROM_DT < 20080101;
  tags: [date_basis, raw_integer_dates, claim_segments]
  notes: Some stays began in late 2007 and ended in 2008.

- id: M-022
  group: medium
  question: How many hospital stays were admitted in one year and discharged in the next?
  sql: |-
    SELECT COUNT(DISTINCT CLM_ID)
    FROM inpatient_claims
    WHERE CLM_ADMSN_DT // 10000 < NCH_BENE_DSCHRG_DT // 10000;
  tags: [date_basis, raw_integer_dates, claim_segments]
  notes: Year boundary crossings.

- id: M-023
  group: medium
  question: What was the average member inpatient deductible per hospital stay, for each start year 2008-2010?
  sql: |-
    WITH c AS (
      SELECT CLM_ID, DESYNPUF_ID,
             MIN(CLM_FROM_DT) AS start_dt,
             SUM(NCH_BENE_IP_DDCTBL_AMT) AS deductible,
             SUM(CLM_PMT_AMT) AS paid
      FROM inpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    )
    SELECT start_dt // 10000 AS start_year, AVG(deductible) AS avg_deductible
    FROM c
    WHERE start_dt BETWEEN 20080101 AND 20101231
    GROUP BY start_year
    ORDER BY start_year;
  tags: [payment_type, date_basis, claim_segments, null_handling]
  notes: Member-paid deductible per stay. Segment-2 rows have no dates but carry payments, so amounts are summed per claim before filtering on the claim's start date.

- id: M-024
  group: medium
  question: For each year 2008-2010, how many hospital stays had a payment from another primary payer?
  sql: |-
    WITH c AS (
      SELECT CLM_ID, DESYNPUF_ID,
             MIN(CLM_FROM_DT) AS start_dt,
             SUM(NCH_PRMRY_PYR_CLM_PD_AMT) AS primary_paid,
             SUM(CLM_PMT_AMT) AS paid
      FROM inpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    )
    SELECT start_dt // 10000 AS start_year, COUNT(*) AS stays
    FROM c
    WHERE primary_paid > 0
      AND start_dt BETWEEN 20080101 AND 20101231
    GROUP BY start_year
    ORDER BY start_year;
  tags: [payment_type, claim_segments, date_basis, null_handling]
  notes: Primary payer amount summed per claim. Segment-2 rows have no dates but carry payments, so amounts are summed per claim before filtering on the claim's start date.

- id: M-025
