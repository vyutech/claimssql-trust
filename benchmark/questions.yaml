  notes: Per-claim totals; window ranking per year.

- id: H-012
  group: hard
  question: Among members with a 2009 hospital stay, what share of 2009 inpatient payment went to the top 1% of those members?
  sql: |-
    WITH c AS (
      SELECT CLM_ID, DESYNPUF_ID,
             MIN(CLM_FROM_DT) AS start_dt,
             MIN(CLM_DRG_CD) AS drg,
             SUM(CLM_PMT_AMT) AS paid
      FROM inpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    ),
    m AS (
      SELECT DESYNPUF_ID, SUM(paid) AS paid
      FROM c
      WHERE start_dt BETWEEN 20090101 AND 20091231
      GROUP BY DESYNPUF_ID
    ),
    r AS (
      SELECT paid, NTILE(100) OVER (ORDER BY paid DESC, DESYNPUF_ID) AS pct
      FROM m
    )
    SELECT SUM(CASE WHEN pct = 1 THEN paid ELSE 0 END) / SUM(paid) AS top1_share
    FROM r;
  tags: [payment_type, claim_segments, null_handling]
  notes: Per-claim totals first; NTILE(100) groups members into percentiles. Ties broken by code so the answer is deterministic.

- id: H-013
  group: hard
  question: Among members with any 2008 claim, how many had total 2008 Medicare claim payments more than 10 times the average?
  sql: |-
    WITH ip AS (
      SELECT CLM_ID, DESYNPUF_ID, MIN(CLM_FROM_DT) AS start_dt, SUM(CLM_PMT_AMT) AS paid
      FROM inpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    ),
    op AS (
      SELECT CLM_ID, DESYNPUF_ID, MIN(CLM_FROM_DT) AS start_dt, SUM(CLM_PMT_AMT) AS paid
      FROM outpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    ),
    claims AS (
      SELECT DESYNPUF_ID, paid FROM ip
      WHERE start_dt BETWEEN 20080101 AND 20081231
      UNION ALL
      SELECT DESYNPUF_ID, paid FROM op
      WHERE start_dt BETWEEN 20080101 AND 20081231
      UNION ALL
      SELECT DESYNPUF_ID,
             COALESCE(LINE_NCH_PMT_AMT_1, 0) + COALESCE(LINE_NCH_PMT_AMT_2, 0) + COALESCE(LINE_NCH_PMT_AMT_3, 0) +
               COALESCE(LINE_NCH_PMT_AMT_4, 0) + COALESCE(LINE_NCH_PMT_AMT_5, 0) + COALESCE(LINE_NCH_PMT_AMT_6, 0) +
               COALESCE(LINE_NCH_PMT_AMT_7, 0) + COALESCE(LINE_NCH_PMT_AMT_8, 0) + COALESCE(LINE_NCH_PMT_AMT_9, 0) +
               COALESCE(LINE_NCH_PMT_AMT_10, 0) + COALESCE(LINE_NCH_PMT_AMT_11, 0) + COALESCE(LINE_NCH_PMT_AMT_12, 0) +
               COALESCE(LINE_NCH_PMT_AMT_13, 0)
      FROM carrier_claims
      WHERE CLM_FROM_DT BETWEEN 20080101 AND 20081231
    ),
    m AS (
      SELECT DESYNPUF_ID, SUM(paid) AS total
      FROM claims
      GROUP BY DESYNPUF_ID
    )
    SELECT COUNT(*)
    FROM m
    WHERE total > 10 * (SELECT AVG(total) FROM m);
  tags: [cross_table, wide_line_items, payment_type, claim_segments, null_handling]
  notes: Carrier payment = sum of 13 line payments; inpatient/outpatient payments summed per claim so dateless segment-2 rows are kept.

