- id: E-022
  group: easy
  question: How many hospital stays are there in total?
  sql: |-
    SELECT COUNT(DISTINCT CLM_ID)
    FROM inpatient_claims;
  tags: [claim_segments]
  notes: Some claims have two segment rows; COUNT(*) overcounts.

