          COALESCE(LINE_ALOWD_CHRG_AMT_7, 0) + COALESCE(LINE_ALOWD_CHRG_AMT_8, 0) + COALESCE(LINE_ALOWD_CHRG_AMT_9, 0) +
          COALESCE(LINE_ALOWD_CHRG_AMT_10, 0) + COALESCE(LINE_ALOWD_CHRG_AMT_11, 0) + COALESCE(LINE_ALOWD_CHRG_AMT_12, 0) +
