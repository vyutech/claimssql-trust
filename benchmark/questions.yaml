- id: E-034
  group: easy
  question: What did Medicare pay in total for outpatient claims starting in 2010?
  sql: |-
    WITH c AS (
      SELECT CLM_ID, DESYNPUF_ID,
             MIN(CLM_FROM_DT) AS start_dt,
             SUM(CLM_PMT_AMT) AS paid
      FROM outpatient_claims
      GROUP BY CLM_ID, DESYNPUF_ID
    )
    SELECT SUM(paid)
    FROM c
    WHERE start_dt BETWEEN 20100101 AND 20101231;
  tags: [payment_type, raw_integer_dates, date_basis, claim_segments, null_handling]
  notes: Filtering rows by date would drop segment-2 payments. Segment-2 rows have no dates but carry payments, so amounts are summed per claim before filtering on the claim's start date.

