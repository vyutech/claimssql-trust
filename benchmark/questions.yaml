- id: E-009
  group: easy
  question: How many members died during 2009?
  sql: |-
    SELECT COUNT(DISTINCT DESYNPUF_ID)
    FROM beneficiary
    WHERE BENE_DEATH_DT BETWEEN 20090101 AND 20091231;
  tags: [raw_integer_dates, death_attrition, multi_year_beneficiary]
  notes: Dates are YYYYMMDD integers; count distinct members in case the date repeats across year rows.

- id: E-010
  group: easy
  question: How many different members appear across all three years?
  sql: |-
    SELECT COUNT(DISTINCT DESYNPUF_ID)
    FROM beneficiary;
  tags: [multi_year_beneficiary]
  notes: COUNT(*) would count member-years, not members.

- id: E-011
  group: easy
  question: In 2008, how many members have no death date recorded?
  sql: |-
    SELECT COUNT(*)
    FROM beneficiary
    WHERE year = 2008
      AND BENE_DEATH_DT IS NULL;
  tags: [null_handling, multi_year_beneficiary]
  notes: Missing death date means the member was alive.

