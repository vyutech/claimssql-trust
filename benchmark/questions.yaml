# ClaimsSQL-Trust — answerable questions (easy, medium, hard), 120 total
# Drafted with AI help. Owner must run, check and reword each before keeping it.
# REPLACE the whole content of benchmark/questions.yaml with this file.
# v3: top-N queries have tie-breakers.
# v2: payment questions now sum per claim, so dateless segment-2 rows are not dropped.

- id: E-001
  group: easy
  question: How many members are in the 2009 data?
  sql: |-
    SELECT COUNT(*)
    FROM beneficiary
    WHERE year = 2009;
  tags: [multi_year_beneficiary]
  notes: One row per member per year, so the year filter is required.

- id: E-002
  group: easy
  question: How many female members were there in 2008?
  sql: |-
    SELECT COUNT(*)
    FROM beneficiary
    WHERE year = 2008
      AND BENE_SEX_IDENT_CD = '2';
  tags: [code_as_text, multi_year_beneficiary]
  notes: 'Sex is a text code: ''1'' male, ''2'' female.'

- id: E-003
  group: easy
  question: How many members had heart failure in 2010?
  sql: |-
    SELECT COUNT(*)
    FROM beneficiary
    WHERE year = 2010
      AND SP_CHF = 1;
  tags: [coded_flag, multi_year_beneficiary]
  notes: Chronic-condition flags use 1 = yes, 2 = no.

