[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimssql"
version = "0.1.0"
description = "ClaimsSQL-Trust: abstention-aware Text-to-SQL on healthcare claims data"
readme = "README.md"
# Spec targets 3.11; developed on 3.14 (owner's decision, P0).
requires-python = ">=3.11"
authors = [{ name = "Vyshnavi Vadla" }]
dependencies = [
    # Minimum = the versions this project is developed and tested with. Older
    # ones can lack things the code uses (an old sqlglot broke the Kaggle run).
    "duckdb>=2.0.0,<3",
    "sqlglot>=30.31.0,<31",
    "httpx>=0.28.1,<1",
    "pyyaml>=6.0.3,<7",
    "python-dotenv",
    "pydantic>=2.14.3,<3",
    "fastapi",
    "uvicorn",
    "streamlit",
    "pandas",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Only scripts/make_catalogue.py needs this, to read the CMS codebook PDF.
catalogue = ["pypdf"]
# Only needed to run notebooks/analysis.ipynb from the command line.
notebook = ["nbclient", "nbformat", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
